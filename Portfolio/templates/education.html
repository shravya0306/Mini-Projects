{% extends 'index.html' %} {% block content %}
<div class="container py-5 mt-4">
  <h2 class="mb-3 text-primary fw-bold">Education</h2>

  {% for edu in education %}

  <div class="edu-box mb-4 p-3 bg-white shadow-sm rounded">
    <h5 class="fw-bold">{{ edu['degree'] }}</h5>
    <p>{{ edu['institute'] }}</p>
    <p>{{ edu['graduation_info'] }}</p>
    <p class="fw-semibold">{{ edu['score'] }}</p>
  </div>
  {% endfor %}
</div>
{% endblock %}
